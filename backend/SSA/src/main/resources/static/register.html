<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Register - Skill Swap Platform</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f766e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SkillSwap">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="stylesheet" href="css.css">
    <script src="theme.js"></script>
    <style>
        body {
            max-width: none;
            margin: 0;
            padding: 18px 14px 30px;
        }
        .container {
            max-width: 620px;
            margin: 30px auto;
            padding: 30px;
        }
        h2 {
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 0.94rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        input, select, textarea {
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        .message {
            margin-top: 15px;
            text-align: center;
        }
        .success {
            border-left: none;
        }
        .error {
            border-left: none;
        }
        .link {
            text-align: center;
            margin-top: 15px;
            line-height: 1.9;
        }
        .link a {
            color: var(--button-color);
            text-decoration: none;
        }
        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <button id="themeToggle"></button>
    </nav>

    <div class="container">
        <h2>Register for Skill Swap</h2>
        <p class="subtitle">Create your profile and start exchanging skills with your community.</p>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Create a Password" required>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            <input type="text" id="location" placeholder="City/Location" required>
            <select id="availability" required>
                <option value="">Select Availability</option>
                <option value="weekdays">Weekdays</option>
                <option value="weekends">Weekends</option>
                <option value="flexible">Flexible</option>
                <option value="evenings">Evenings</option>
            </select>
            <textarea id="skills" placeholder="What skills can you teach? (comma-separated)"></textarea>
            <button type="submit">Register</button>
        </form>
        <div id="message"></div>
        <div class="link">
            Already have an account? <a href="login.html">Login here</a> | <a href="index.html">Back to Home</a>
        </div>
    </div>

    <script src="api-client.js?v=20260319"></script>
    <script>
        const REGISTER_TIMEOUT_MS = 20000;

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = this.querySelector('button[type="submit"]');
            
            if (password !== confirmPassword) {
                showMessage('message', 'Passwords do not match!', false);
                return;
            }

            if (!navigator.onLine) {
                showMessage('message', 'You appear to be offline. Please check internet and retry.', false);
                return;
            }
            
            const userData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: password,
                location: document.getElementById('location').value,
                availability: document.getElementById('availability').value,
                isPublic: true,
                isBanned: false
            };
            
            showLoading('message', true);
            if (submitBtn) {
                submitBtn.disabled = true;
            }

            let result;
            try {
                const timeoutResult = new Promise((resolve) => {
                    setTimeout(() => {
                        resolve({
                            success: false,
                            error: 'Registration timed out. Please retry in a moment.'
                        });
                    }, REGISTER_TIMEOUT_MS);
                });

                result = await Promise.race([
                    SkillSwapAPI.register(userData),
                    timeoutResult
                ]);
            } catch (error) {
                result = {
                    success: false,
                    error: 'Registration failed. Please try again.'
                };
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                }
            }
            
            if (result.success) {
                const messageEl = document.getElementById('message');
                messageEl.className = 'message success';
                messageEl.textContent = 'Registration successful! Redirecting to login...';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                const messageEl = document.getElementById('message');
                messageEl.className = 'message error';

                const rawMessage = result.message || result.error || '';
                const looksLikeWrongServer = typeof rawMessage === 'string'
                    && /not_found|page could not be found/i.test(rawMessage);
                const isPublicHost = !/^(localhost|127\.0\.0\.1|::1|\[::1\]|10\.0\.2\.2)$/.test(window.location.hostname);

                if (looksLikeWrongServer) {
                    messageEl.textContent = isPublicHost
                        ? 'Cannot reach SkillSwap backend API from this page. Please wait a minute for Render to wake up, then retry registration.'
                        : 'Cannot reach SkillSwap backend API from this page. Open the app from http://localhost:8080 (or your PC IP on port 8080).';
                } else {
                    messageEl.textContent = rawMessage || 'Registration failed. Please try again.';
                }
            }
        });

        // If already logged in, redirect to profile
        if (SkillSwapAPI.isLoggedIn()) {
            window.location.href = 'profile.html';
        }
    </script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>

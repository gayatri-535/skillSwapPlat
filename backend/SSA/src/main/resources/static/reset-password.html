<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Skill Swap Platform</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f766e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SkillSwap">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="stylesheet" href="css.css">
    <script src="theme.js"></script>
    <style>
        body {
            max-width: none;
            margin: 0;
            padding: 18px 14px 30px;
        }
        .container {
            max-width: 620px;
            margin: 30px auto;
            padding: 30px;
        }
        h2 {
            color: var(--text-primary);
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        input, textarea {
            font-size: 16px;
        }
        .message {
            margin-top: 15px;
            text-align: center;
        }
        .success {
            border-left: none;
        }
        .error {
            border-left: none;
        }
        .info {
            border-left: none;
        }
        .link {
            text-align: center;
            margin-top: 15px;
            line-height: 1.9;
        }
        .link a {
            color: var(--button-color);
            text-decoration: none;
        }
        .link a:hover {
            text-decoration: underline;
        }
        .password-requirements {
            background: var(--bg-elevated);
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            margin: 10px 0;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <button id="themeToggle"></button>
    </nav>

    <div class="container">
        <h2>Reset Your Password</h2>
        
        <div id="message"></div>
        
        <form id="resetPasswordForm">
            <textarea 
                id="token" 
                placeholder="Paste your reset token here"
                rows="3"
                required
            ></textarea>
            
            <input 
                type="password" 
                id="newPassword" 
                placeholder="Enter new password"
                required
            >
            
            <input 
                type="password" 
                id="confirmPassword" 
                placeholder="Confirm new password"
                required
            >
            
            <div class="password-requirements">
                <strong>Password Requirements:</strong>
                <ul style="margin: 5px 0; padding-left: 20px;">
                    <li>At least 6 characters long</li>
                    <li>Passwords must match</li>
                </ul>
            </div>
            
            <button type="submit">Reset Password</button>
        </form>

        <div class="link">
            Don't have a reset token? <a href="forgot-password.html">Request one here</a> | <a href="login.html">Back to Login</a> | <a href="index.html">Home</a>
        </div>
    </div>

    <script src="api-client.js?v=20260424"></script>
    <script>
        // Extract token from URL if provided
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        if (tokenFromUrl) {
            document.getElementById('token').value = tokenFromUrl;
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const token = document.getElementById('token').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');
            
            // Validate passwords match
            if (newPassword !== confirmPassword) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Passwords do not match!';
                return;
            }
            
            // Validate password length
            if (newPassword.length < 6) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Password must be at least 6 characters long!';
                return;
            }
            
            if (!token) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Please enter your reset token!';
                return;
            }
            
            messageDiv.textContent = 'Processing...';
            messageDiv.className = 'message info';
            
            try {
                // First validate the token
                const validateResponse = await apiFetch(`/users/validate-reset-token?token=${encodeURIComponent(token)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!validateResponse.ok) {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = 'Invalid or expired reset token. Please request a new one.';
                    return;
                }
                
                // Token is valid, proceed with password reset
                const resetResponse = await apiFetch(`/users/reset-password?token=${encodeURIComponent(token)}&newPassword=${encodeURIComponent(newPassword)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = resetResponse.ok ? await resetResponse.text() : await resetResponse.text();
                
                if (resetResponse.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.innerHTML = '<strong>Success!</strong><br>' + data + '<br><br>Redirecting to login...';
                    
                    // Redirect to login after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                    
                    // Clear the form
                    document.getElementById('resetPasswordForm').reset();
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = data || 'Error resetting password';
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Error: ' + error.message + '\n\nMake sure the backend is running.';
            }
        });
    </script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swap Requests - Skill Swap Platform</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f766e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SkillSwap">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="stylesheet" href="css.css">
    <script src="theme.js"></script>
    <style>
        body {
            max-width: none;
            margin: 0;
            padding: 18px 14px 30px;
        }
        .container {
            max-width: 1020px;
            margin: 24px auto;
            padding: 30px;
        }
        h2 {
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            font-size: 15px;
        }
        .tab-btn.active {
            color: #fff;
            border-bottom-color: transparent;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-section {
            background: var(--bg-elevated);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            margin: 10px 8px 10px 0;
        }
        .swap-card {
            background: var(--bg-elevated);
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            border-left: 4px solid var(--button-color);
            border: 1px solid var(--border-color);
        }
        .swap-card h4 {
            margin: 0 0 10px 0;
            color: var(--text-primary);
        }
        .swap-info {
            margin: 5px 0;
            color: var(--text-secondary);
        }
        .swap-info strong {
            color: var(--text-primary);
        }
        .swap-actions {
            margin-top: 10px;
        }
        .accept-btn {
            background-color: var(--button-secondary);
        }
        .accept-btn:hover {
            background-color: var(--button-secondary-hover);
        }
        .cancel-btn {
            background-color: #dc2626;
        }
        .cancel-btn:hover {
            background-color: #b91c1c;
        }
        .message {
            margin: 15px 0;
            text-align: center;
        }
        .success {
            border-left: none;
        }
        .error {
            border-left: none;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .nav-links {
            text-align: center;
            margin: 20px 0;
            line-height: 1.8;
        }
        .nav-links a {
            color: var(--button-color);
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="profile.html">My Profile</a>
        <button id="themeToggle"></button>
    </nav>

    <div class="container">
        <h2>Skill Swap Management</h2>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('create', this)">Create New Swap</button>
            <button class="tab-btn" onclick="switchTab('browse', this)">Browse Available Swaps</button>
            <button class="tab-btn" onclick="switchTab('myrequests', this)">My Swap Requests</button>
        </div>

        <!-- Create Swap Tab -->
        <div id="create" class="tab-content active">
            <div class="form-section">
                <h3>Create a New Skill Swap Request</h3>
                <form id="createSwapForm">
                    <label>Find a skill provider (start typing email):</label>
                    <input type="email" id="receiverEmail" placeholder="Enter user email to find skills they offer" required>
                    <div id="userSearchResults" style="margin: 10px 0;"></div>
                    
                    <label>Skill You Want to Learn:</label>
                    <input type="text" id="requestedSkill" placeholder="e.g., Python Programming" required>
                    
                    <label>Skill You Can Teach:</label>
                    <input type="text" id="offeredSkill" placeholder="e.g., Web Design" required>
                    
                    <button type="submit">Create Swap Request</button>
                </form>
                <div id="createMessage"></div>
            </div>
        </div>

        <!-- Browse Swaps Tab -->
        <div id="browse" class="tab-content">
            <h3>Available Skill Swaps</h3>
            <button onclick="loadAllSwaps()">Refresh List</button>
            <div id="allSwapsContainer"></div>
        </div>

        <!-- My Requests Tab -->
        <div id="myrequests" class="tab-content">
            <h3>Your Swap Requests</h3>
            <button onclick="loadMySwaps()">Refresh List</button>
            <div id="mySwapsContainer"></div>
        </div>

        <div class="nav-links">
            <a href="profile.html">My Profile</a> | <a href="index.html">Home</a>
        </div>
    </div>

    <script src="api-client.js?v=20260424"></script>
    <script>
        // Check if user is logged in
        if (!SkillSwapAPI.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        const user = SkillSwapAPI.getCurrentUser();
        let selectedReceiverId = null;

        function switchTab(tabName, clickedButton) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            if (clickedButton) {
                clickedButton.classList.add('active');
            }

            // Load data for the tab
            if (tabName === 'browse') {
                loadAllSwaps();
            } else if (tabName === 'myrequests') {
                loadMySwaps();
            }
        }

        // Create Swap Form
        document.getElementById('createSwapForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!selectedReceiverId) {
                showMessage('createMessage', 'Please select a user from the search results', false);
                return;
            }

            const requestedSkill = document.getElementById('requestedSkill').value;
            const offeredSkill = document.getElementById('offeredSkill').value;
            
            showLoading('createMessage', true);
            const result = await SkillSwapAPI.createSwap(user.id, selectedReceiverId, requestedSkill, offeredSkill);
            
            if (result.success) {
                showMessage('createMessage', 'Swap request created successfully!', true);
                document.getElementById('createSwapForm').reset();
                selectedReceiverId = null;
                document.getElementById('userSearchResults').innerHTML = '';
            } else {
                showMessage('createMessage', result.message || result.error || 'Failed to create swap', false);
            }
        });

        // User Search
        document.getElementById('receiverEmail').addEventListener('input', async function(e) {
            const email = e.target.value.trim();
            if (!email) {
                document.getElementById('userSearchResults').innerHTML = '';
                return;
            }

            const result = await SkillSwapAPI.getUserByEmail(email);
            if (result.success && result.user && result.user.id !== user.id) {
                selectedReceiverId = result.user.id;
                document.getElementById('userSearchResults').innerHTML = `
                    <div style="padding: 10px; background: #e8f5e9; border-radius: 4px;">
                        <strong>${result.user.name}</strong> (${result.user.email})<br>
                        Location: ${result.user.location || 'N/A'} | Availability: ${result.user.availability || 'N/A'}
                    </div>
                `;
            } else {
                selectedReceiverId = null;
                document.getElementById('userSearchResults').innerHTML = '<div style="color: #999;">User not found</div>';
            }
        });

        // Load all swaps
        async function loadAllSwaps() {
            const container = document.getElementById('allSwapsContainer');
            showLoading(container.id, true);
            
            const result = await SkillSwapAPI.listSwaps();
            
            if (result.success && result.swaps && result.swaps.length > 0) {
                container.innerHTML = result.swaps.map(swap => `
                    <div class="swap-card">
                        <h4>Swap #${swap.id}</h4>
                        <div class="swap-info">
                            <strong>Requested Skill:</strong> ${swap.requestedSkill}
                        </div>
                        <div class="swap-info">
                            <strong>Offered Skill:</strong> ${swap.offeredSkill}
                        </div>
                        <div class="swap-info">
                            <strong>Status:</strong> <span style="color: #4CAF50;">${swap.status}</span>
                        </div>
                        <div class="swap-actions">
                            ${swap.receiverId === user.id && swap.status === 'pending' ? `
                                <button class="accept-btn" onclick="acceptSwap(${swap.id})">Accept</button>
                                <button class="cancel-btn" onclick="cancelSwap(${swap.id})">Decline</button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<div class="empty-state">No swap requests available</div>';
            }
        }

        // Load user's swaps
        async function loadMySwaps() {
            const container = document.getElementById('mySwapsContainer');
            showLoading(container.id, true);
            
            const result = await SkillSwapAPI.listUserSwaps(user.id);
            
            if (result.success && result.swaps && result.swaps.length > 0) {
                container.innerHTML = result.swaps.map(swap => `
                    <div class="swap-card">
                        <h4>Swap #${swap.id}</h4>
                        <div class="swap-info">
                            <strong>Requested Skill:</strong> ${swap.requestedSkill}
                        </div>
                        <div class="swap-info">
                            <strong>Offered Skill:</strong> ${swap.offeredSkill}
                        </div>
                        <div class="swap-info">
                            <strong>Status:</strong> <span style="color: #4CAF50;">${swap.status}</span>
                        </div>
                        <div class="swap-actions">
                            ${swap.status === 'pending' ? `
                                <button class="cancel-btn" onclick="cancelSwap(${swap.id})">Cancel Request</button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<div class="empty-state">You have no swap requests</div>';
            }
        }

        // Accept swap
        async function acceptSwap(swapId) {
            if (confirm('Accept this swap request?')) {
                const result = await SkillSwapAPI.acceptSwap(swapId);
                if (result.success) {
                    alert('Swap accepted!');
                    loadAllSwaps();
                } else {
                    alert('Failed to accept swap: ' + result.message);
                }
            }
        }

        // Cancel swap
        async function cancelSwap(swapId) {
            if (confirm('Cancel this swap request?')) {
                const result = await SkillSwapAPI.cancelSwap(swapId);
                if (result.success) {
                    alert('Swap cancelled!');
                    loadAllSwaps();
                    loadMySwaps();
                } else {
                    alert('Failed to cancel swap: ' + result.message);
                }
            }
        }
    </script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>

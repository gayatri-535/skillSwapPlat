<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>User Profile - Skill Swap Platform</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f766e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SkillSwap">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="stylesheet" href="css.css">
    <script src="theme.js"></script>
    <style>
        body {
            max-width: none;
            margin: 0;
            padding: 18px 14px 30px;
        }
        .container {
            max-width: 860px;
            margin: 24px auto;
            padding: 30px;
        }
        h2 {
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        .profile-info {
            background: var(--bg-elevated);
            padding: 20px;
            border-radius: 14px;
            margin: 20px 0;
            border: 1px solid var(--border-color);
        }
        .info-row {
            margin: 10px 0;
            padding: 8px;
            border-radius: 10px;
            background: var(--bg-primary);
        }
        .info-label {
            font-weight: bold;
            color: var(--text-secondary);
        }
        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            margin: 10px 8px 10px 0;
        }
        .logout-btn {
            background-color: #dc2626;
        }
        .message {
            margin-top: 15px;
            text-align: center;
        }
        .success {
            border-left: none;
        }
        .error {
            border-left: none;
        }
        .section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        .nav-links {
            text-align: center;
            margin: 20px 0;
            line-height: 1.8;
        }
        .nav-links a {
            color: var(--button-color);
            text-decoration: none;
            margin: 0 10px;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="swap-requests.html">Swap Requests</a>
        <button id="themeToggle"></button>
    </nav>

    <div class="container">
        <h2>User Profile</h2>
        
        <div id="profileContent"></div>
        <div id="message"></div>

        <div class="section">
            <h3>Quick Actions</h3>
            <button onclick="location.href='swap-requests.html'">View Skill Swaps</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a> | <a href="swap-requests.html">Swap Requests</a>
        </div>
    </div>

    <script src="api-client.js?v=20260424"></script>
    <script>
        // Check if user is logged in
        if (!SkillSwapAPI.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        const user = SkillSwapAPI.getCurrentUser();
        
        // Display profile info
        const profileContent = document.getElementById('profileContent');
        profileContent.innerHTML = `
            <div class="profile-info">
                <div class="info-row">
                    <span class="info-label">Name:</span> ${user.name}
                </div>
                <div class="info-row">
                    <span class="info-label">Email:</span> ${user.email}
                </div>
                <div class="info-row">
                    <span class="info-label">Location:</span> ${user.location || 'Not specified'}
                </div>
                <div class="info-row">
                    <span class="info-label">Availability:</span> ${user.availability || 'Not specified'}
                </div>
                <div class="info-row">
                    <span class="info-label">Account Status:</span> ${user.isBanned ? 'Banned' : 'Active'}
                </div>
            </div>
        `;

        function logout() {
            SkillSwapAPI.logout();
            window.location.href = 'index.html';
        }
    </script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>

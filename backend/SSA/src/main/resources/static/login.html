<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Skill Swap Platform</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f766e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SkillSwap">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="stylesheet" href="css.css">
    <script src="theme.js"></script>
    <style>
        body {
            max-width: none;
            margin: 0;
            padding: 18px 14px 30px;
        }
        .container {
            max-width: 560px;
            margin: 30px auto;
            padding: 30px;
        }
        h2 {
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 0.94rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        input, button {
            font-size: 16px;
        }
        .message {
            margin-top: 15px;
            text-align: center;
        }
        .success {
            border-left: none;
        }
        .error {
            border-left: none;
        }
        .link {
            text-align: center;
            margin-top: 15px;
            line-height: 1.9;
        }
        .link a {
            color: var(--button-color);
            text-decoration: none;
        }
        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
        <button id="themeToggle"></button>
    </nav>

    <div class="container">
        <h2>Login to Skill Swap</h2>
        <p class="subtitle">Welcome back. Access your profile and continue exchanging skills.</p>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Enter your email" required>
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="submit">Login</button>
        </form>
        <div id="message"></div>
        <div class="link">
            Don't have an account? <a href="register.html">Register here</a> | <a href="forgot-password.html">Forgot Password?</a> | <a href="index.html">Back to Home</a>
        </div>
    </div>

    <script src="api-client.js?v=20260419"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');
            const submitBtn = this.querySelector('button[type="submit"]');
            
            showLoading('message', true);
            messageEl.className = '';

            if (submitBtn) {
                submitBtn.disabled = true;
            }

            try {
                const result = await SkillSwapAPI.login(email, password);

                if (result.success) {
                    messageEl.className = 'message success';
                    messageEl.textContent = 'Login successful! Redirecting...';
                    setTimeout(() => {
                        window.location.href = 'profile.html';
                    }, 1500);
                } else {
                    messageEl.className = 'message error';
                    const rawError = result.message || result.error || 'Login failed. Please try again.';
                    if (/timed out|Failed to fetch|NetworkError|Unable to reach/i.test(rawError)) {
                        messageEl.textContent = 'Backend is waking up or unreachable. Please retry in 30-60 seconds.';
                    } else {
                        messageEl.textContent = rawError;
                    }
                }
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = 'Login failed. Please try again.';
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                }
            }
        });

        // If already logged in, redirect to profile
        if (SkillSwapAPI.isLoggedIn()) {
            window.location.href = 'profile.html';
        }
    </script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>

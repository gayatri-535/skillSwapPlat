# Datasource configuration
# Default local runtime uses embedded H2 so backend can start without external DB credentials.
# In deployed environments, set SPRING_DATASOURCE_URL/USERNAME/PASSWORD to use PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./.data/skillswapdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Initialize schema on startup for fresh cloud databases.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-local.sql

spring.jpa.hibernate.ddl-auto=update
# Server Configuration
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.skillswap=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
